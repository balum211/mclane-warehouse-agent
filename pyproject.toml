[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mclane-warehouse-agent"
version = "0.1.0"
description = "McLane warehouse operations copilot: Google ADK multi-agent system over harmonized Manhattan Active, Blue Yonder and Argent WMS data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.18",
  "google-cloud-bigquery>=3.25",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
alloydb = ["google-cloud-alloydb-connector[pg8000]>=1.4", "pg8000>=1.31"]
cloudsql = ["cloud-sql-python-connector[pg8000]>=1.12", "pg8000>=1.31"]
postgres = ["pg8000>=1.31"]
toolbox = ["toolbox-core>=0.5"]
dev = ["pytest>=8", "duckdb>=1.1", "ruff>=0.6"]

# `uv sync` installs the dev group by default (the codelab workflow); pip users: pip install -e ".[dev]".
[dependency-groups]
dev = ["pytest>=8", "duckdb>=1.1", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["warehouse_agent*", "warehouse_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741"]
